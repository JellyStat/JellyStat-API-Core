name: Docker

on:
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The UI is bundled into both the Docker image and the Windows installer, so fetch it once
  fetch-ui:
    runs-on: ubuntu-latest
    steps:
      # Fetch the latest versioned release artifact from the UI repo
      - name: Download Latest Versioned UI Asset
        run: |
          set -euo pipefail
          mkdir -p wwwroot
          
          echo "Fetching the latest release tag name from UI repo..."
          LATEST_TAG=$(gh api repos/jellystat/jellystat-ui/releases/latest --jq '.tag_name')
          
          if [ -z "$LATEST_TAG" ]; then
            echo "Error: No releases found in jellystat/jellystat-ui!"
            exit 1
          fi
          
          echo "Found latest UI release tag: $LATEST_TAG"
          echo "Downloading ${LATEST_TAG}.zip..."
          
          # Download the specific zip file tied to this release tag
          gh release download "$LATEST_TAG" -R jellystat/jellystat-ui -p "${LATEST_TAG}.zip"
          
          # Unzip into the wwwroot folder and clean up the zip file
          unzip "${LATEST_TAG}.zip" -d wwwroot
          rm "${LATEST_TAG}.zip"
          
          echo "UI asset successfully deployed to wwwroot/"
        env:
          GH_TOKEN: ${{ secrets.JELLYSTAT_UI_TOKEN }}

      - name: Upload UI asset
        uses: actions/upload-artifact@v4
        with:
          name: wwwroot
          path: wwwroot
          if-no-files-found: error
          include-hidden-files: true

  build-api:
    needs: fetch-ui
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout API repository
        uses: actions/checkout@v4

      # 1. Use the UI asset fetched by the fetch-ui job
      - name: Download UI asset
        uses: actions/download-artifact@v4
        with:
          name: wwwroot
          path: wwwroot

      # 2. Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.5.0

      # 3. Set up BuildKit Docker container builder
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0

      # 4. Log into registry ghcr.io except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # 6. Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5.0.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 7. Publish release.json so running instances can detect a newer API version.
      # Runs after the image is pushed, so the notifier never points at an image that doesn't exist yet.
      - name: Publish API release info
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          VERSION=$(grep -oPm1 '(?<=<AssemblyVersion>)[^<]+' Jellystat-API-Core.csproj)
          jq -n --arg version "$VERSION" '{version: $version}' > release.json

          # Nothing to commit unless the version changed (or the file is new)
          if [ -z "$(git status --porcelain -- release.json)" ]; then
            echo "API version $VERSION unchanged; release.json not updated."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release.json
          git commit -m "chore: update API release info for $VERSION [skip ci]"
          git push origin HEAD:main

      # 8. Sign the resulting Docker image digest except on PRs.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

  # Native Windows build: a self-contained win-x64 publish wrapped in an Inno Setup installer
  # that registers Jellystat as a Windows service (see installer/jellystat.iss)
  build-windows:
    needs: fetch-ui
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout API repository
        uses: actions/checkout@v4

      - name: Download UI asset
        uses: actions/download-artifact@v4
        with:
          name: wwwroot
          path: wwwroot

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read API version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Jellystat-API-Core.csproj)).Project.PropertyGroup.AssemblyVersion | Where-Object { $_ } | Select-Object -First 1
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish win-x64
        shell: pwsh
        run: dotnet publish Jellystat-API-Core.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc.FullName "/DAppVersion=${{ steps.version.outputs.version }}" "/DPublishDir=$PWD\publish" installer\jellystat.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Jellystat-Setup-${{ steps.version.outputs.version }}
          path: installer/Output/*.exe
          if-no-files-found: error

      # Attach the installer to the GitHub release for version tags
      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
